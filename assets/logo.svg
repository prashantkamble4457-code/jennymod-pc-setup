<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="44" fill="#1B1035"/>
  <!-- Pixelated heart, off-center left, chunky blocks -->
  <g>
    <rect x="72" y="86" width="20" height="20" fill="#FF4FA3"/>
    <rect x="96" y="86" width="20" height="20" fill="#FF4FA3"/>
    <rect x="120" y="86" width="20" height="20" fill="#FF4FA3"/>
    <rect x="56" y="106" width="20" height="20" fill="#FF4FA3"/>
    <rect x="76" y="106" width="20" height="20" fill="#FF4FA3"/>
    <rect x="100" y="106" width="20" height="20" fill="#FF4FA3"/>
    <rect x="124" y="106" width="20" height="20" fill="#FF4FA3"/>
    <rect x="144" y="106" width="20" height="20" fill="#FF4FA3"/>
    <rect x="56" y="126" width="20" height="20" fill="#FF4FA3"/>
    <rect x="80" y="126" width="20" height="20" fill="#FF4FA3"/>
    <rect x="104" y="126" width="20" height="20" fill="#FF4FA3"/>
    <rect x="128" y="126" width="20" height="20" fill="#FF4FA3"/>
    <rect x="148" y="126" width="20" height="20" fill="#FF4FA3"/>
    <rect x="64" y="146" width="20" height="20" fill="#FF4FA3"/>
    <rect x="88" y="146" width="20" height="20" fill="#FF4FA3"/>
    <rect x="112" y="146" width="20" height="20" fill="#FF4FA3"/>
    <rect x="136" y="146" width="20" height="20" fill="#FF4FA3"/>
    <rect x="80" y="166" width="20" height="20" fill="#FF4FA3"/>
    <rect x="104" y="166" width="20" height="20" fill="#FF4FA3"/>
    <rect x="128" y="166" width="20" height="20" fill="#FF4FA3"/>
    <rect x="96" y="186" width="20" height="20" fill="#FF4FA3"/>
    <rect x="120" y="186" width="20" height="20" fill="#FF4FA3"/>
    <rect x="108" y="206" width="20" height="20" fill="#FF4FA3"/>
    <!-- highlight pixels -->
    <rect x="72" y="96" width="10" height="10" fill="#F2E9FF"/>
    <rect x="120" y="96" width="10" height="10" fill="#F2E9FF"/>
    <rect x="64" y="132" width="10" height="10" fill="#F2E9FF"/>
    <!-- jaw shadow of wrench on heart -->
    <rect x="76" y="112" width="8" height="8" fill="#1B1035" opacity="0.35"/>
    <rect x="128" y="112" width="8" height="8" fill="#1B1035" opacity="0.35"/>
  </g>
  <!-- Chunky wrench crossing diagonally, jaw clamping heart -->
  <g>
    <!-- handle: bold diagonal chunky bar -->
    <path d="M168 208 L196 180 L188 172 L160 200 Z" fill="#5CE1E6"/>
    <path d="M196 180 L208 168 L200 160 L188 172 Z" fill="#5CE1E6"/>
    <!-- mid handle chunk -->
    <path d="M156 196 L172 180 L164 172 L148 188 Z" fill="#5CE1E6"/>
    <!-- wrench jaw: C-shape clamping upper-right of heart -->
    <path d="M148 96 L168 76 L180 88 L172 96 L180 104 L168 116 L156 104 L164 96 L156 88 Z" fill="#5CE1E6"/>
    <!-- jaw inner accent -->
    <path d="M160 88 L168 80 L172 84 L168 92 L164 96 Z" fill="#F2E9FF"/>
    <!-- pixel nod: small teeth -->
    <rect x="180" y="88" width="12" height="12" fill="#5CE1E6"/>
    <rect x="186" y="94" width="10" height="10" fill="#1B1035"/>
    <rect x="146" y="100" width="10" height="10" fill="#5CE1E6"/>
    <rect x="150" y="94" width="8" height="8" fill="#1B1035"/>
    <!-- wrench base knob -->
    <path d="M204 172 L216 160 L224 168 L212 180 Z" fill="#5CE1E6"/>
    <circle cx="214" cy="166" r="7" fill="#F2E9FF"/>
    <circle cx="214" cy="166" r="3" fill="#1B1035"/>
  </g>
  <!-- small pixel sparks / tinkerer energy -->
  <g>
    <rect x="196" y="128" width="8" height="8" fill="#F2E9FF"/>
    <rect x="206" y="136" width="6" height="6" fill="#FF4FA3"/>
    <rect x="40" y="196" width="8" height="8" fill="#5CE1E6"/>
    <rect x="32" y="188" width="6" height="6" fill="#F2E9FF"/>
    <rect x="176" y="208" width="8" height="8" fill="#FF4FA3"/>
  </g>
  <!-- tiny wordmark optional -->
  <text x="128" y="240" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#5CE1E6" letter-spacing="1">JENNYMOD</text>
</svg>
